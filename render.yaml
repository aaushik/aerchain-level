services:
  - type: web
    name: level-rfx
    runtime: docker
    plan: free
    healthCheckPath: /api/state
    envVars:
      - key: LLM_PROVIDER
        value: gemini
      - key: GEMINI_MODEL
        value: gemini-3.5-flash
      - key: GEMINI_FALLBACK
        value: gemini-2.5-flash,gemini-3.5-flash-lite,gemini-3.1-flash-lite
      - key: GEMINI_API_KEY
        sync: false
      - key: ANTHROPIC_API_KEY
        sync: false
